name: CI/CD Simple Web Deployment

# Kích hoạt pipeline mỗi khi có code đẩy lên nhánh main
on:
  push:
    branches: [ "main" ]

jobs:
  # GIAI ĐOẠN 1: CI (Continuous Integration) - Kiểm tra lỗi code
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo code về môi trường test của GitHub
        uses: actions/checkout@v4

      - name: Chạy script kiểm thử tự động (Unit Test)
        run: |
          chmod +x test.sh
          ./test.sh

  # GIAI ĐOẠN 2: CD (Continuous Deployment) - Tự động đẩy lên máy chủ thật
  continuous-deployment:
    needs: continuous-integration # Chỉ chạy khi CI thành công
    runs-on: ubuntu-latest
    steps:
      - name: Kéo code về môi trường deploy của GitHub
        uses: actions/checkout@v4

      - name: Tự động copy file sang Server đích qua SCP/SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "index.html"
          target: "/var/www/html"
          overwrite: true